name: WebCPU strict FP32 OFF attribution diagnostic
on:
  push:
    branches: ['benchmark/native-browser-research-20261008']
    paths:
      - 'benchmarks/webcpu-research/off-attribution/voicevox_core_benchmark.py'
      - '.github/workflows/benchmark-webcpu-off-attribution.yml'
permissions:
  contents: read
concurrency:
  group: webcpu-off-attribution-${{ github.ref }}
  cancel-in-progress: false
jobs:
  browser-off:
    if: github.repository == 'Hiroshiba/voicevox_core'
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          persist-credentials: false
          sparse-checkout: benchmarks/webcpu-research/off-attribution
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install pinned orchestration tools and Chromium dependencies
        run: |
          python -m pip install uv==0.11.23 playwright==1.63.0
          python -m playwright install-deps chromium
      - name: Verify complete distributed source and offline tests
        working-directory: benchmarks/webcpu-research/off-attribution
        run: |
          echo "fc1e0cc5f5641bd377443a7fabab1b308046bafd406852e2703aec63a46a7c3d  voicevox_core_benchmark.py" | sha256sum --check
          uv run --script voicevox_core_benchmark.py --help
          uv run --script voicevox_core_benchmark.py --dry-run
          uv run --script voicevox_core_benchmark.py --self-test
      - name: Run bounded production-profile and separate count-only phases
        id: diagnostic
        continue-on-error: true
        working-directory: benchmarks/webcpu-research/off-attribution
        run: |
          uv run --script voicevox_core_benchmark.py \
            --cache-dir "$RUNNER_TEMP/off-attribution-private" \
            --output "$RUNNER_TEMP/off-attribution-public"
      - name: Validate public summary and exact standalone HTML
        id: validation
        if: always() && steps.diagnostic.outcome != 'skipped'
        working-directory: benchmarks/webcpu-research/off-attribution
        run: |
          uv run --script voicevox_core_benchmark.py --validate-report "$RUNNER_TEMP/off-attribution-public"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always() && steps.validation.outcome == 'success'
        with:
          name: webcpu-off-attribution-summary-and-html
          path: |
            ${{ runner.temp }}/off-attribution-public/summary.json
            ${{ runner.temp }}/off-attribution-public/report.html
          if-no-files-found: error
          retention-days: 14
      - name: Require completed valid diagnostic
        if: always()
        env:
          DIAGNOSTIC_OUTCOME: ${{ steps.diagnostic.outcome }}
          VALIDATION_OUTCOME: ${{ steps.validation.outcome }}
        run: |
          test "$DIAGNOSTIC_OUTCOME" = success
          test "$VALIDATION_OUTCOME" = success
