name: Measure distributed one-file strict FP32 benchmark
on:
  push:
    branches: ['benchmark/native-browser-research-20261008']
    paths:
      - '.github/workflows/benchmark-webcpu-standalone-measure.yml'
      - 'benchmarks/webcpu-research/standalone-measure/**'
permissions:
  contents: read
concurrency:
  group: webcpu-fp32-standalone-measure-${{ github.ref }}
  cancel-in-progress: false
jobs:
  measure-distributed-file:
    if: github.repository == 'Hiroshiba/voicevox_core' && github.ref == 'refs/heads/benchmark/native-browser-research-20261008'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      EXPECTED_SOURCE_SHA256: 10edbd6a4cc120c7bab10ff40b47e41f880e54f3ba46756e78de88fa6d41facf
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          persist-credentials: false
          sparse-checkout: |
            benchmarks/webcpu-research/standalone
            benchmarks/webcpu-research/standalone-measure
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - name: Configure isolated distribution and private paths
        shell: bash
        run: |
          set -euo pipefail
          echo "BENCH_CACHE=$RUNNER_TEMP/voicevox-core-benchmark" >> "$GITHUB_ENV"
          echo "PLAYWRIGHT_BROWSERS_PATH=$RUNNER_TEMP/voicevox-core-benchmark/playwright" >> "$GITHUB_ENV"
          echo "UV_CACHE_DIR=$RUNNER_TEMP/one-file-uv-cache" >> "$GITHUB_ENV"
          echo "DIST=$RUNNER_TEMP/one-file-distribution" >> "$GITHUB_ENV"
          echo "RESULTS=$GITHUB_WORKSPACE/results/standalone-measure" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/one-file-distribution" "$RUNNER_TEMP/standalone-private" results/standalone-measure
          echo "TMPDIR=$RUNNER_TEMP/standalone-private" >> "$GITHUB_ENV"
          cp benchmarks/webcpu-research/standalone/voicevox_core_benchmark.py "$RUNNER_TEMP/one-file-distribution/"
          test "$(find "$RUNNER_TEMP/one-file-distribution" -maxdepth 1 -type f | wc -l)" -eq 1
          echo "$EXPECTED_SOURCE_SHA256  $RUNNER_TEMP/one-file-distribution/voicevox_core_benchmark.py" | sha256sum -c -
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ${{ runner.temp }}/voicevox-core-benchmark/builds
            ${{ runner.temp }}/voicevox-core-benchmark/cargo-target
            ${{ runner.temp }}/voicevox-core-benchmark/cargo/bin
            ${{ runner.temp }}/voicevox-core-benchmark/rustup
            ${{ runner.temp }}/voicevox-core-benchmark/runtimes
            ${{ runner.temp }}/voicevox-core-benchmark/playwright
            ${{ runner.temp }}/voicevox-core-benchmark/emsdk-4.0.8
          key: Linux-voicevox-research-${{ github.sha }}
          restore-keys: Linux-voicevox-research-
      - name: Install exact uv version
        run: |
          python -m pip install --disable-pip-version-check uv==0.11.23
          uv --version | tee results/standalone-measure/uv-version.log
          uv --version | grep -E '^uv 0\.11\.23( |$)'
      - name: Fresh-directory one-file help and self-test
        shell: bash
        run: |
          set -euo pipefail
          cd "$DIST"
          uv run voicevox_core_benchmark.py --help > "$RESULTS/help.log" 2>&1
          uv run voicevox_core_benchmark.py --self-test > "$RESULTS/self-test.log" 2>&1
          test "$(find . -maxdepth 1 -type f | wc -l)" -eq 1
          sha256sum voicevox_core_benchmark.py > "$RESULTS/distribution-sha256.log"
      - name: Install pinned Chromium and required system libraries
        run: uv run --with playwright==1.63.0 python -m playwright install --with-deps chromium
      - name: Measure unchanged distributed file and write its native HTML
        id: measure
        shell: bash
        run: |
          set -euo pipefail
          cd "$DIST"
          uv run voicevox_core_benchmark.py --kernel-experiments --threads 2 --seed 1729 \
            --cache-dir "$BENCH_CACHE" --output "$RESULTS/measured.html" > "$RESULTS/measurement.log" 2>&1
          echo "$EXPECTED_SOURCE_SHA256  voicevox_core_benchmark.py" | sha256sum -c -
      - name: Artifact privacy allowlist
        id: privacy
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import json, math, os
          from pathlib import Path
          root=Path(os.environ['RESULTS'])
          forbidden={'wav_base64','audio_outputs','raw_samples','model_bytes','tensor_data','weights','audio_base64','raw_wave','wav_bytes'}
          def check(value):
              if isinstance(value,dict):
                  for key,item in value.items():
                      assert key.lower() not in forbidden, key
                      if key.lower() in {'fp32_samples','pcm_samples'}:
                          assert type(item) is int and item >= 0, key
                      else: check(item)
              elif isinstance(value,list):
                  for item in value: check(item)
              elif isinstance(value,str): assert 'data:audio/' not in value.lower()
              elif isinstance(value,float): assert math.isfinite(value)
          for path in root.rglob('*'):
              if not path.is_file(): continue
              assert path.suffix in {'.json','.log','.html','.png'},path
              with path.open('rb') as stream: assert not stream.read(12).startswith((b'RIFF',b'fLaC',b'OggS')),path
              if path.suffix=='.json': check(json.loads(path.read_text()))
              elif path.suffix in {'.log','.html'}:
                  text=path.read_text(errors='replace').lower()
                  assert all(token not in text for token in ('wav_base64','data:audio/','"audio_outputs"')),path
          PY
      - name: Preserve exact native HTML and validated measured evidence
        id: validated
        if: always() && steps.privacy.outcome == 'success'
        run: |
          python benchmarks/webcpu-research/standalone-measure/log_measured.py \
            --candidate "$DIST/voicevox_core_benchmark.py" --result "$RESULTS/measured.json" \
            --html "$RESULTS/measured.html" --validated-output "$GITHUB_WORKSPACE/results/validated-measurement"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always() && steps.privacy.outcome == 'success' && steps.validated.outcome == 'success'
        with:
          name: standalone-kernel-actual-measurement
          path: results/validated-measurement/
          if-no-files-found: error
      # No unconditional private-root deletion: uncertain descendant cleanup
      # deliberately preserves its tree. The ephemeral GitHub-hosted runner
      # tears down remaining storage after the job. No cache-save step exists.
