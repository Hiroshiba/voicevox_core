name: WebCPU strict FP32 runtime dispatch confirmation
on:
  push:
    branches: ['benchmark/native-browser-research-20261008']
    paths:
      - 'benchmarks/webcpu-research/runtime/**'
      - '.github/workflows/benchmark-webcpu-runtime.yml'
permissions:
  contents: read
concurrency:
  group: webcpu-fp32-runtime-${{ github.ref }}
  cancel-in-progress: false
jobs:
  runtime-confirmation:
    if: github.repository == 'Hiroshiba/voicevox_core'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Configure private temporary paths
        run: |
          echo "BENCH_CACHE=$RUNNER_TEMP/voicevox-core-benchmark" >> "$GITHUB_ENV"
          echo "PLAYWRIGHT_BROWSERS_PATH=$RUNNER_TEMP/voicevox-core-benchmark/playwright" >> "$GITHUB_ENV"
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          persist-credentials: false
          sparse-checkout: benchmarks/webcpu-research
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        id: cache
        with:
          path: |
            ${{ runner.temp }}/voicevox-core-benchmark/builds
            ${{ runner.temp }}/voicevox-core-benchmark/cargo-target
            ${{ runner.temp }}/voicevox-core-benchmark/cargo/bin
            ${{ runner.temp }}/voicevox-core-benchmark/rustup
            ${{ runner.temp }}/voicevox-core-benchmark/runtimes
            ${{ runner.temp }}/voicevox-core-benchmark/playwright
            ${{ runner.temp }}/voicevox-core-benchmark/emsdk-4.0.8
          key: Linux-voicevox-research-${{ github.sha }}
          restore-keys: Linux-voicevox-research-
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        if: steps.cache.outputs.cache-matched-key == ''
        with:
          path: ${{ runner.temp }}/voicevox-core-benchmark
          key: Linux-voicevox-research-legacy-${{ github.sha }}
          restore-keys: Linux-voicevox-core-v1-
      - name: Install pinned tools and browser
        run: |
          python -m pip install uv==0.11.23 playwright==1.63.0
          python -m playwright install --with-deps chromium
      - name: Validate harness and prepare original browser builds
        id: prepare
        run: |
          uv run benchmarks/webcpu-research/voicevox_webcpu_research.py --self-test
          uv run benchmarks/webcpu-research/voicevox_webcpu_research.py --prepare-only --backend-experiments all --threads 2 --cache-dir "$BENCH_CACHE"
      - name: Prepare source-pinned runtime variants with native-bundle proof
        id: runtime
        run: |
          mkdir -p results "$RUNNER_TEMP/voicevox-research-private"
          python benchmarks/webcpu-research/runtime/test_prepare_vocoder_runtime.py
          python benchmarks/webcpu-research/runtime/test_numeric_log.py
          node benchmarks/webcpu-research/runtime/test_dispatch_helper.cjs
          uv run --with psutil==7.2.2 --with platformdirs==4.12.2 --with cmake==4.4.3 --with ninja==1.13.2 --with libclang==18.1.1 python benchmarks/webcpu-research/runtime/prepare_vocoder_runtime.py --cache "$BENCH_CACHE" --output "$RUNNER_TEMP/voicevox-research-private/runtime.json" --harness benchmarks/webcpu-research/voicevox_webcpu_research.py --kernel-dir benchmarks/webcpu-research/kernel
          python benchmarks/webcpu-research/runtime/apply_browser_dispatch.py benchmarks/webcpu-research/voicevox_webcpu_research.py --output "$RUNNER_TEMP/voicevox-research-private/browser_runtime.py" --helper benchmarks/webcpu-research/runtime/core_dispatch_check.js
      - name: Confirm actual CORE OFF runtime with fresh process sets
        id: confirm
        if: always() && steps.runtime.outcome == 'success'
        run: |
          python benchmarks/webcpu-research/runtime/test_runtime_confirmation.py
          uv run benchmarks/webcpu-research/runtime/browser_runtime_confirmation.py --harness "$RUNNER_TEMP/voicevox-research-private/browser_runtime.py" --manifest "$RUNNER_TEMP/voicevox-research-private/runtime.json" --cache "$BENCH_CACHE" --revec off --output results/runtime-confirmation-off.json
      - name: Check same-run CPU reference and separate provider placement
        if: always() && steps.confirm.outcome == 'success'
        run: |
          mkdir -p results/quality
          python - <<'PYDIAG'
          import json
          from pathlib import Path
          p=Path('results/runtime-confirmation-off.json')
          p.with_suffix('.diagnostics.json').write_text(json.dumps(json.loads(p.read_text())['diagnostics'],indent=2))
          PYDIAG
          CPU_JS=$(python -c 'import json,os; from pathlib import Path; print(json.loads((Path(os.environ["BENCH_CACHE"])/"research-assets.json").read_text())["binaries"]["mt"])')
          uv run --with playwright==1.63.0 --with psutil==7.2.2 python benchmarks/webcpu-research/runtime/browser_reference_and_profile.py --harness "$RUNNER_TEMP/voicevox-research-private/browser_runtime.py" --manifest "$RUNNER_TEMP/voicevox-research-private/runtime.json" --cpu-binary "$CPU_JS" --cpu-receipt "$(dirname "$CPU_JS")/complete.json" --activation-evidence results/runtime-confirmation-off.diagnostics.json --revec off --output results/quality/runtime-confirmation-off-quality.json --profile-xnn
      - name: Check artifact privacy allowlist
        id: privacy
        if: always()
        run: |
          python - <<'PY'
          from pathlib import Path
          for p in Path('results').rglob('*'):
              if p.is_file():
                  assert p.suffix in {'.json','.log','.html','.png'}, p
                  assert not p.read_bytes().startswith((b'RIFF',b'fLaC',b'OggS')), p
                  if p.suffix in {'.json','.html'}:
                      s=p.read_text(); assert 'wav_base64' not in s and 'data:audio/' not in s and 'audio_outputs' not in s
          PY
      - name: Print privacy-checked numeric provenance and results
        if: always() && steps.privacy.outcome == 'success'
        run: |
          if test -f results/runtime-confirmation-off.json; then
            python benchmarks/webcpu-research/runtime/log_runtime_confirmation.py --input results/runtime-confirmation-off.json
          fi
          python benchmarks/webcpu-research/runtime/log_runtime_results.py results/quality
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always() && steps.privacy.outcome == 'success'
        with:
          name: webcpu-fp32-runtime-confirmation
          path: results/
          if-no-files-found: warn
      - name: Remove private generated assets before tool cache save
        if: always()
        run: |
          rm -rf "$RUNNER_TEMP/voicevox-research-private"
          # Official SDK test audio is irrelevant to compilation and excluded from saved tools.
          find "$BENCH_CACHE/emsdk-4.0.8" -type d -path '*/upstream/emscripten/test' -prune -exec rm -rf {} +
          python - <<'PY'
          import os
          from pathlib import Path
          root=Path(os.environ['BENCH_CACHE'])
          for folder in ['builds','cargo-target','cargo/bin','rustup','runtimes','playwright','emsdk-4.0.8']:
              for p in (root/folder).rglob('*'):
                  if p.is_file(): assert p.suffix.lower() not in {'.wav','.pcm','.f32','.vvm','.onnx'}, p
          PY
      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        if: success() && steps.cache.outputs.cache-hit != 'true'
        with:
          path: |
            ${{ runner.temp }}/voicevox-core-benchmark/builds
            ${{ runner.temp }}/voicevox-core-benchmark/cargo-target
            ${{ runner.temp }}/voicevox-core-benchmark/cargo/bin
            ${{ runner.temp }}/voicevox-core-benchmark/rustup
            ${{ runner.temp }}/voicevox-core-benchmark/runtimes
            ${{ runner.temp }}/voicevox-core-benchmark/playwright
            ${{ runner.temp }}/voicevox-core-benchmark/emsdk-4.0.8
          key: Linux-voicevox-research-${{ github.sha }}
