name: Bounded strict FP32 XNN macro operator screen
on:
  push:
    branches: ['benchmark/native-browser-research-20261008']
    paths:
      - 'benchmarks/webcpu-research/macro-timing/**'
      - '.github/workflows/benchmark-webcpu-macro-timing.yml'
permissions:
  contents: read
concurrency:
  group: webcpu-fp32-macro-timing-${{ github.ref }}
  cancel-in-progress: false
jobs:
  bounded-operator-screen:
    if: github.repository == 'Hiroshiba/voicevox_core' && github.ref == 'refs/heads/benchmark/native-browser-research-20261008'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          persist-credentials: false
          sparse-checkout: benchmarks/webcpu-research/macro-timing
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - name: Verify frozen sources and configure isolated paths
        run: |
          set -euo pipefail
          cd benchmarks/webcpu-research/macro-timing
          sha256sum -c SOURCE_SHA256SUMS
          python -m py_compile *.py
          python test_validators.py
          echo "BENCH_CACHE=$RUNNER_TEMP/voicevox-core-benchmark" >> "$GITHUB_ENV"
          echo "PLAYWRIGHT_BROWSERS_PATH=$RUNNER_TEMP/voicevox-core-benchmark/playwright" >> "$GITHUB_ENV"
          echo "ARTIFACT_DIR=$GITHUB_WORKSPACE/results/macro-timing" >> "$GITHUB_ENV"
          mkdir -p results "$GITHUB_WORKSPACE/results/macro-timing"
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ${{ runner.temp }}/voicevox-core-benchmark/builds
            ${{ runner.temp }}/voicevox-core-benchmark/cargo-target
            ${{ runner.temp }}/voicevox-core-benchmark/cargo/bin
            ${{ runner.temp }}/voicevox-core-benchmark/rustup
            ${{ runner.temp }}/voicevox-core-benchmark/runtimes
            ${{ runner.temp }}/voicevox-core-benchmark/playwright
            ${{ runner.temp }}/voicevox-core-benchmark/emsdk-4.0.8
          key: Linux-voicevox-research-${{ github.sha }}
          restore-keys: Linux-voicevox-research-
      - name: Install pinned browser and resource tools
        run: |
          python -m pip install --disable-pip-version-check playwright==1.63.0 psutil==7.2.2
          python -m playwright install --with-deps chromium
      - name: Verify dependencies and rebuild isolated production and diagnostic links
        working-directory: benchmarks/webcpu-research/macro-timing
        run: |
          set -euo pipefail
          python prepare_inputs.py
      - name: Enforce object provenance and instrumentation separation
        working-directory: benchmarks/webcpu-research/macro-timing
        run: |
          set -euo pipefail
          python rebuild_control.py
          python make_patch.py
          python build.py
      - name: Validate sibling then execute exactly three fresh process sets
        working-directory: benchmarks/webcpu-research/macro-timing
        run: |
          set -euo pipefail
          python run_browser.py --screen > results/screen-run.log 2>&1
          python validate_screen.py
      - name: Validate privacy and print complete raw paired evidence
        id: privacy
        if: always()
        working-directory: benchmarks/webcpu-research/macro-timing
        run: |
          set -euo pipefail
          python log_results.py | tee "$ARTIFACT_DIR/complete-screen.log"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always() && steps.privacy.outcome == 'success'
        with:
          name: xnn-macro-bounded-operator-screen
          path: results/macro-timing/
          if-no-files-found: error
      # No cache-save, model/audio input, full CORE run, sampler, or automatic matrix expansion.
