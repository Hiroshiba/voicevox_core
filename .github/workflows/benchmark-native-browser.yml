# New branch in Hiroshiba's fork only. Production and upstream workflows are untouched.
name: Benchmark native and browser VOICEVOX CORE
on:
  push:
    branches: ['benchmark/native-browser-*']
    paths:
      - benchmarks/voicevox_core_benchmark.py
      - .github/workflows/benchmark-native-browser.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: voicevox-browser-benchmark-${{ github.ref }}
  cancel-in-progress: true
jobs:
  benchmark:
    if: github.repository == 'Hiroshiba/voicevox_core'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false
          sparse-checkout: benchmarks
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Restore downloaded tools and compiled CORE
        id: benchmark-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.temp }}/voicevox-core-benchmark
          key: ${{ runner.os }}-voicevox-core-v1-${{ hashFiles('benchmarks/voicevox_core_benchmark.py') }}
          restore-keys: ${{ runner.os }}-voicevox-core-v1-
      - name: Install runner dependencies
        shell: bash
        run: |
          python -m pip install 'uv==0.12.19' 'playwright==1.63.0'
          python -m playwright install-deps chromium
      - name: Check the standalone script
        shell: bash
        run: uv run benchmarks/voicevox_core_benchmark.py --self-test
      - name: Preflight V8 revectorization with existing runtime
        shell: bash
        run: |
          mkdir -p results
          uv run benchmarks/voicevox_core_benchmark.py \
            --cache-dir "$RUNNER_TEMP/voicevox-core-benchmark" \
            --threads 2 --backend-experiments v8 \
            --seed 20261007 --output results/benchmark.html
      - name: Validate and screenshot the report
        shell: bash
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/voicevox-core-benchmark/playwright
        run: |
          python - <<'PYREPORT'
          from pathlib import Path
          import json
          from playwright.sync_api import sync_playwright
          with sync_playwright() as p:
              browser = p.chromium.launch()
              page = browser.new_page(viewport={"width": 1200, "height": 1000})
              page.goto(Path('results/benchmark.html').resolve().as_uri())
              assert page.locator('details[open]').count() == 0
              measured = json.loads(Path('results/benchmark.json').read_text())
              assert len(page.locator('#raw-csv').text_content().strip().splitlines()) == len(measured['trials']) + 1
              modes = measured['modes']
              keys = {mode['key'] for mode in modes}
              assert page.locator('svg').count() == 2 + len(modes)
              assert page.locator('svg.cpu-profile').count() == len(modes)
              assert measured['schema_version'] == 3 and len(measured['trials']) == 15 * len(modes)
              assert keys == {'browser_mt', 'browser_revectorize'} and len(measured['trials']) == 30
              env = measured['environment']
              assert ('browser_xnnpack' in keys) == env['xnnpack_diagnostic']['verified']
              assert ('browser_mt_fixed' in keys) == ('browser_xnnpack' in keys)
              assert ('browser_revectorize' in keys) == env['revectorization_diagnostic']['verified']
              if 'browser_xnnpack' in keys:
                  assert env['xnnpack_diagnostic']['provider_kernel_counts']['XnnpackExecutionProvider'] > 0
                  assert env['browser_xnnpack_xnn_threads'] == 2 and env['browser_xnnpack_ort_global_threads'] == 1
                  assert env['browser_xnnpack_pthreads_after_warmup'] == 1
                  assert env['browser_xnnpack_fixed_matches'] == 1 and env['browser_mt_fixed_fixed_matches'] == 1
              if 'browser_revectorize' in keys:
                  assert env['revectorization_diagnostic']['control']['transformed_groups'] == 0
                  assert env['revectorization_diagnostic']['candidate']['transformed_groups'] > 0
                  assert env['timed_revectorization_engine']['js_flags'] == ['--js-flags=--wasm-revectorize']
              assert measured['schedule_method'].startswith('seeded position-balanced')
              for mode in modes:
                  positions = [i % len(modes) for i, block in enumerate(measured['schedule']) if block['mode'] == mode['key']]
                  counts = [positions.count(i) for i in range(len(modes))]
                  assert max(counts) - min(counts) <= 1
              assert all(not row['cpu_incomplete'] for row in measured['trials']), 'Incomplete CPU observations'
              assert all(row['cpu_time_s'] > 0 and row['cpu_window_s'] > 0 for row in measured['trials'])
              assert measured['environment']['cpu_sample_interval_ms'] == 100
              assert 'separate Chromium' in measured['environment']['cpu_browser_scope']
              assert len(page.locator('#cpu-csv').text_content().strip().splitlines()) == 1 + sum(len(row['cpu_trace']) for row in measured['trials'])
              checks = measured['output_checks']
              assert checks['reference_mode'] == 'browser_mt' and checks['reference_deterministic']
              assert set(checks['modes']) == {mode['key'] for mode in measured['modes']}
              assert all(row['finite'] and row['fp32_samples'] > 0 for row in checks['modes'].values())
              profiles = json.loads(page.locator('#cpu-profile-data').text_content())
              assert {profile['mode'] for profile in profiles} == keys
              for profile in profiles:
                  assert profile['complete_trials'] == 15
                  assert all(0 < point['trial_count'] <= 15 and point['q25_percent'] <= point['median_percent'] <= point['q75_percent'] for point in profile['points'])
              for mode in modes:
                  chart = page.locator('svg.cpu-profile[data-mode="' + mode['key'] + '"]')
                  assert mode['label'] in chart.locator('title').first.text_content()
                  assert chart.locator('path').count() > 0
              page.screenshot(path='results/report.png', full_page=True)
              browser.close()
          PYREPORT
      - name: Upload measured results
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: voicevox-core-browser-benchmark
          path: results/
          if-no-files-found: warn
      - name: Save downloaded tools and compiled CORE even if measurement failed
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        if: always() && steps.benchmark-cache.outputs.cache-hit != 'true'
        with:
          path: ${{ runner.temp }}/voicevox-core-benchmark
          key: ${{ steps.benchmark-cache.outputs.cache-primary-key }}
