# Fork-only: pushes refresh the report; full timing runs require an explicit dispatch.
name: Benchmark native and browser VOICEVOX CORE
on:
  push:
    branches: ['benchmark/native-browser-*']
    paths:
      - benchmarks/voicevox_core_benchmark.py
      - benchmarks/report-spectrograms/**
      - .github/workflows/benchmark-native-browser.yml
  workflow_dispatch:
    inputs:
      operation:
        description: Render existing measurements or perform a new benchmark
        type: choice
        default: render
        options: [render, benchmark]
permissions:
  contents: read
  actions: read
concurrency:
  group: voicevox-browser-benchmark-${{ github.ref }}
  cancel-in-progress: true
jobs:
  benchmark:
    if: github.repository == 'Hiroshiba/voicevox_core' && github.ref != 'refs/heads/benchmark/native-browser-research-20261008'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false
          sparse-checkout: benchmarks
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Restore tools only for an explicitly requested benchmark
        id: benchmark-cache
        if: github.event_name == 'workflow_dispatch' && inputs.operation == 'benchmark'
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.temp }}/voicevox-core-benchmark
          key: ${{ runner.os }}-voicevox-core-v1-${{ hashFiles('benchmarks/voicevox_core_benchmark.py') }}
          restore-keys: ${{ runner.os }}-voicevox-core-v1-
      - name: Install report and browser dependencies
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/voicevox-core-benchmark/playwright
        run: |
          python -m pip install 'uv==0.12.19' 'playwright==1.63.0'
          python -m playwright install --with-deps chromium
      - name: Check the standalone script
        run: uv run benchmarks/voicevox_core_benchmark.py --self-test
      - name: Download the exact prior measurement artifact
        if: github.event_name != 'workflow_dispatch' || inputs.operation != 'benchmark'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: voicevox-core-browser-benchmark
          run-id: 37633692185
          github-token: ${{ github.token }}
          path: original
      - name: Preserve measurements and record their provenance
        if: github.event_name != 'workflow_dispatch' || inputs.operation != 'benchmark'
        run: |
          python - <<'PYDATA'
          from pathlib import Path
          import hashlib, json
          source = Path('original/benchmark.json')
          expected = 'c24a589bd96ff0063248eea51b2b132ea413bbc3eb716bbb4ad0809de57270f1'
          assert hashlib.sha256(source.read_bytes()).hexdigest() == expected
          data = json.loads(source.read_text())
          assert data['schema_version'] == 4 and len(data['trials']) == 105
          data['environment']['measurement_commit'] = '6c282db49dcd4f22bcc067acca731740c655ce18'
          data['environment']['measurement_run_url'] = 'https://github.com/Hiroshiba/voicevox_core/actions/runs/37633692185'
          data['environment']['source_measurement_json_sha256'] = expected
          Path('results').mkdir(exist_ok=True)
          Path('results/benchmark.json').write_text(json.dumps(data, ensure_ascii=False, indent=2))
          PYDATA
      - name: Render spectrogram images and existing measurements without synthesis
        if: github.event_name != 'workflow_dispatch' || inputs.operation != 'benchmark'
        run: |
          uv run benchmarks/voicevox_core_benchmark.py --report-from results/benchmark.json \
            --spectrogram-dir benchmarks/report-spectrograms --output results/benchmark.html
      - name: Run new synthesis measurements only when explicitly dispatched
        if: github.event_name == 'workflow_dispatch' && inputs.operation == 'benchmark'
        run: |
          mkdir -p results
          uv run benchmarks/voicevox_core_benchmark.py --cache-dir "$RUNNER_TEMP/voicevox-core-benchmark" \
            --threads 2 --backend-experiments --seed 20261007 --output results/benchmark.html
      - name: Validate and screenshot the report
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/voicevox-core-benchmark/playwright
        run: |
          uv run --with pillow==12.3.0 --with playwright==1.63.0 python - <<'PYREPORT'
          from pathlib import Path
          import csv, importlib.util, io, json, math, sys
          from playwright.sync_api import sync_playwright
          spec = importlib.util.spec_from_file_location('benchmark_report', 'benchmarks/voicevox_core_benchmark.py')
          module = importlib.util.module_from_spec(spec)
          sys.modules[spec.name] = module
          spec.loader.exec_module(module)
          measured = json.loads(Path('results/benchmark.json').read_text())
          module.validate_results(measured)
          assert 'audio_outputs' not in measured
          if Path('original/benchmark.json').exists():
              module.attach_saved_spectrograms(measured, Path('benchmarks/report-spectrograms'))
          else:
              module.validate_spectrograms(measured)
          assert not list(Path('results').rglob('*.wav'))
          for file in Path('results').rglob('*'):
              if file.is_file():
                  assert not file.read_bytes().startswith((b'RIFF', b'fLaC', b'OggS'))
          report_text = Path('results/benchmark.html').read_text()
          assert 'data:audio/' not in report_text and '<audio' not in report_text and 'wav_base64' not in report_text
          keys = {mode['key'] for mode in measured['modes']}
          assert keys == {'native', 'browser', 'browser_mt', 'browser_mt_fixed', 'browser_xnnpack', 'browser_revectorize', 'browser_xnnpack_revectorize'}
          assert len(measured['trials']) == 105
          if Path('original/benchmark.json').exists():
              original = json.loads(Path('original/benchmark.json').read_text())
              for key in ('trials', 'modes', 'output_checks', 'schedule', 'log', 'created_at', 'audio_s'):
                  assert measured[key] == original[key], 'Original measurement data changed: ' + key
          with sync_playwright() as p:
              browser = p.chromium.launch()
              page = browser.new_page(viewport={'width': 1200, 'height': 1000})
              page.goto(Path('results/benchmark.html').resolve().as_uri())
              assert page.locator('details[open]').count() == 0
              assert page.locator('svg.cpu-profile').count() == 7
              assert page.locator('path.timing-ci').count() == 7
              assert page.locator('figure.spectrogram').count() == 3
              actual_images = page.locator('figure.spectrogram img').evaluate_all('(images) => images.map(image => ({src: image.src, width: image.naturalWidth, height: image.naturalHeight, complete: image.complete}))')
              assert len(actual_images) == len(measured['spectrograms'])
              for actual, expected in zip(actual_images, measured['spectrograms']):
                  assert actual['complete'] and (actual['width'], actual['height']) == (expected['width'], expected['height'])
                  assert actual['src'] == 'data:image/png;base64,' + expected['png_base64']
              assert list(csv.reader(io.StringIO(page.locator('#raw-csv').text_content()))) == list(csv.reader(io.StringIO(module.trial_csv(measured['trials']))))
              assert list(csv.reader(io.StringIO(page.locator('#cpu-csv').text_content()))) == list(csv.reader(io.StringIO(module.cpu_trace_csv(measured['trials']))))
              profiles = json.loads(page.locator('#cpu-profile-data').text_content())
              assert profiles == module.aggregate_cpu_profiles(measured)
              assert page.locator('rect.cpu-ci').count() == sum(point['ci_low_percent'] is not None for profile in profiles for point in profile['points'])
              for profile in profiles:
                  assert profile['points'][0]['start_s'] == -1
                  assert profile['points'][-1]['end_s'] >= profile['response_end_max_s'] + 1 - 1e-8
                  for point in profile['points']:
                      if point['full_trial_count'] < 15:
                          assert point['ci_low_percent'] is None and point['ci_high_percent'] is None
                      else:
                          assert point['ci_low_percent'] <= point['median_percent'] <= point['ci_high_percent']
              assert '15回／3ブロック' in page.locator('body').inner_text()
              assert '安定した95%被覆を保証するものではありません' in page.locator('body').inner_text()
              page.screenshot(path='results/report.png', full_page=True)
              browser.close()
          PYREPORT
      - name: Upload report artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: voicevox-core-browser-benchmark
          path: results/
          if-no-files-found: warn
      - name: Save compiled tools only after an explicitly requested benchmark
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        if: always() && github.event_name == 'workflow_dispatch' && inputs.operation == 'benchmark' && steps.benchmark-cache.outputs.cache-hit != 'true'
        with:
          path: ${{ runner.temp }}/voicevox-core-benchmark
          key: ${{ steps.benchmark-cache.outputs.cache-primary-key }}
