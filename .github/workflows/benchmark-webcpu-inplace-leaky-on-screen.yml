name: WebCPU pristine ON reviewed 27-call screen
on:
  push:
    branches: ['benchmark/native-browser-research-20261008']
    paths:
      - 'benchmarks/webcpu-research/inplace-leaky-on/**'
      - '.github/workflows/benchmark-webcpu-inplace-leaky-on-screen.yml'
permissions:
  contents: read
concurrency:
  group: webcpu-inplace-leaky-on-screen-${{ github.ref }}
  cancel-in-progress: false
jobs:
  on-screen:
    if: github.repository == 'Hiroshiba/voicevox_core'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Configure private cache paths
        run: |
          echo "BENCH_CACHE=$RUNNER_TEMP/voicevox-core-benchmark" >> "$GITHUB_ENV"
          echo "PLAYWRIGHT_BROWSERS_PATH=$RUNNER_TEMP/voicevox-core-benchmark/playwright" >> "$GITHUB_ENV"
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          persist-credentials: false
          sparse-checkout: benchmarks/webcpu-research/inplace-leaky-on
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        id: cache
        with:
          path: |
            ${{ runner.temp }}/voicevox-core-benchmark/builds
            ${{ runner.temp }}/voicevox-core-benchmark/cargo-target
            ${{ runner.temp }}/voicevox-core-benchmark/cargo/bin
            ${{ runner.temp }}/voicevox-core-benchmark/rustup
            ${{ runner.temp }}/voicevox-core-benchmark/runtimes
            ${{ runner.temp }}/voicevox-core-benchmark/playwright
            ${{ runner.temp }}/voicevox-core-benchmark/emsdk-4.0.8
          key: Linux-voicevox-research-${{ github.sha }}
          restore-keys: Linux-voicevox-research-
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        if: steps.cache.outputs.cache-matched-key == ''
        with:
          path: ${{ runner.temp }}/voicevox-core-benchmark
          key: Linux-voicevox-research-legacy-${{ github.sha }}
          restore-keys: Linux-voicevox-core-v1-
      - name: Install pinned tools and Chromium
        run: |
          python -m pip install uv==0.11.23 playwright==1.63.0 psutil==7.2.2
          python -m playwright install --with-deps chromium
      - name: Verify frozen research sources and pure tests
        working-directory: benchmarks/webcpu-research/inplace-leaky-on
        run: |
          echo "ee6321044dccadb02d429de32ead9b455e2924969427c7085feb5169954650a8  ci_prepare.py" | sha256sum --check
          echo "514101f81309fd38156b3710cee0a97ede4a2c0d8333e64d4c7868bccbb285c0  browser/SHA256SUMS" | sha256sum --check
          sha256sum --check browser/SHA256SUMS
          echo "390bbc9910a924509dba61778ab89eddef7caff0918b5c9bde8266306c717454  timing-release/SHA256SUMS" | sha256sum --check
          sha256sum --check timing-release/SHA256SUMS
          python -m unittest discover -s timing-release -p 'test_*.py'
          python -m unittest discover -s browser -p 'test_*.py'
          python -m unittest discover -s local-gates -p 'test_source_native_proof.py'
      - name: Prepare pristine source controls with complete native proof
        working-directory: benchmarks/webcpu-research/inplace-leaky-on
        run: |
          uv run --script ci_prepare.py --cache "$BENCH_CACHE" --private "$RUNNER_TEMP/inplace-on-preparation" --manifest "$RUNNER_TEMP/inplace-on-manifest.json"
      - name: Measure reviewed bounded ON screen
        working-directory: benchmarks/webcpu-research/inplace-leaky-on
        run: bash timing-release/run_timing.sh "$RUNNER_TEMP/inplace-on-manifest.json" "$RUNNER_TEMP/inplace-on-result"
      - name: Strictly validate all 27 observations and privacy
        id: validation
        working-directory: benchmarks/webcpu-research/inplace-leaky-on
        run: |
          python timing-release/timing_validate.py "$RUNNER_TEMP/inplace-on-result/timing.json" --output "$RUNNER_TEMP/inplace-on-result/timing-summary.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: success() && steps.validation.outcome == 'success'
        with:
          name: webcpu-pristine-on-reviewed-timing
          path: |
            ${{ runner.temp }}/inplace-on-result/timing.json
            ${{ runner.temp }}/inplace-on-result/timing-summary.json
          if-no-files-found: error
