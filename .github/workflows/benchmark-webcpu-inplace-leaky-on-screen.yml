name: WebCPU pristine ON immutable code capture
on:
  push:
    branches: ['benchmark/native-browser-research-20261008']
    paths:
      - 'benchmarks/webcpu-research/inplace-leaky-on/**'
      - '.github/workflows/benchmark-webcpu-inplace-leaky-on-screen.yml'
permissions:
  contents: read
concurrency:
  group: webcpu-inplace-leaky-on-screen-${{ github.ref }}
  cancel-in-progress: false
jobs:
  on-screen:
    if: github.repository == 'Hiroshiba/voicevox_core'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Configure private cache paths
        run: |
          echo "BENCH_CACHE=$RUNNER_TEMP/voicevox-core-benchmark" >> "$GITHUB_ENV"
          echo "PLAYWRIGHT_BROWSERS_PATH=$RUNNER_TEMP/voicevox-core-benchmark/playwright" >> "$GITHUB_ENV"
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          persist-credentials: false
          sparse-checkout: benchmarks/webcpu-research/inplace-leaky-on
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        id: cache
        with:
          path: |
            ${{ runner.temp }}/voicevox-core-benchmark/builds
            ${{ runner.temp }}/voicevox-core-benchmark/cargo-target
            ${{ runner.temp }}/voicevox-core-benchmark/cargo/bin
            ${{ runner.temp }}/voicevox-core-benchmark/rustup
            ${{ runner.temp }}/voicevox-core-benchmark/runtimes
            ${{ runner.temp }}/voicevox-core-benchmark/playwright
            ${{ runner.temp }}/voicevox-core-benchmark/emsdk-4.0.8
          key: Linux-voicevox-research-${{ github.sha }}
          restore-keys: Linux-voicevox-research-
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        if: steps.cache.outputs.cache-matched-key == ''
        with:
          path: ${{ runner.temp }}/voicevox-core-benchmark
          key: Linux-voicevox-research-legacy-${{ github.sha }}
          restore-keys: Linux-voicevox-core-v1-
      - name: Install pinned tools and Chromium
        run: |
          python -m pip install uv==0.11.23 playwright==1.63.0 psutil==7.2.2
          python -m playwright install --with-deps chromium
      - name: Verify frozen research sources and pure tests
        working-directory: benchmarks/webcpu-research/inplace-leaky-on
        run: |
          echo "ee6321044dccadb02d429de32ead9b455e2924969427c7085feb5169954650a8  ci_prepare.py" | sha256sum --check
          echo "514101f81309fd38156b3710cee0a97ede4a2c0d8333e64d4c7868bccbb285c0  browser/SHA256SUMS" | sha256sum --check
          sha256sum --check browser/SHA256SUMS
          echo "51d3ea34e7efa3557fbea1ce64abf73ecc51b01ac59a05c3b8abf368013f7fcc  jit-capture/SHA256SUMS" | sha256sum --check
          sha256sum --check jit-capture/SHA256SUMS
          echo "53c4db9acaf42292868ccc295c11cbfa0dcb547943e9fdc68973962e5d7c5a19  code-transfer/SHA256SUMS" | sha256sum --check
          sha256sum --check code-transfer/SHA256SUMS
          python -m unittest discover -s code-transfer -p 'test_*.py'
          python -m unittest discover -s jit-capture -p 'test_*.py'
          node jit-capture/test_jit_binding.js
          python -m unittest discover -s browser -p 'test_*.py'
          python -m unittest discover -s local-gates -p 'test_source_native_proof.py'
      - name: Prepare pristine source controls with complete native proof
        working-directory: benchmarks/webcpu-research/inplace-leaky-on
        run: |
          uv run --script ci_prepare.py --cache "$BENCH_CACHE" --private "$RUNNER_TEMP/inplace-on-preparation" --manifest "$RUNNER_TEMP/inplace-on-manifest.json"
      - name: Export exact code before inference, require reviewed notices
        working-directory: benchmarks/webcpu-research/inplace-leaky-on
        run: |
          sha256sum --check code-transfer/SHA256SUMS
          python -m unittest discover -s code-transfer -p 'test_*.py'
          PYTHONPATH=browser python -c 'import sys; from source_manifest import verify_manifest; verify_manifest(sys.argv[1])' "$RUNNER_TEMP/inplace-on-manifest.json"
          python code-transfer/unpack_notices.py --output "$RUNNER_TEMP/inplace-on-notices"
          python code-transfer/verify_notice_inventory.py --manifest "$RUNNER_TEMP/inplace-on-manifest.json" --cache "$BENCH_CACHE" --inventory "$RUNNER_TEMP/inplace-on-notices/NOTICE_INVENTORY.json" --notices "$RUNNER_TEMP/inplace-on-notices/LICENSES.txt" --output "$RUNNER_TEMP/inplace-on-notice-receipt.json"
          PYTHONPATH=browser python code-transfer/code_transfer.py export --manifest "$RUNNER_TEMP/inplace-on-manifest.json" --output "$RUNNER_TEMP/inplace-on-code" --licenses "$RUNNER_TEMP/inplace-on-notices/LICENSES.txt"
      - name: Capture source-bound profiled ON instructions for review
        working-directory: benchmarks/webcpu-research/inplace-leaky-on
        run: bash jit-capture/run_capture_only.sh "$RUNNER_TEMP/inplace-on-manifest.json" "$RUNNER_TEMP/inplace-on-result"
      - name: Strictly revalidate captured evidence awaiting manual review
        id: validation
        working-directory: benchmarks/webcpu-research/inplace-leaky-on
        run: |
          python jit-capture/jit_validate.py "$RUNNER_TEMP/inplace-on-result/capture.json" --output "$RUNNER_TEMP/inplace-on-result/capture-summary.json"
      - name: Bind capture to unchanged code export
        id: codebinding
        working-directory: benchmarks/webcpu-research/inplace-leaky-on
        run: |
          PYTHONPATH=browser python code-transfer/code_transfer.py verify-capture --directory "$RUNNER_TEMP/inplace-on-code" --capture "$RUNNER_TEMP/inplace-on-result/capture.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: success() && steps.validation.outcome == 'success' && steps.codebinding.outcome == 'success'
        with:
          name: webcpu-pristine-on-immutable-code
          path: |
            ${{ runner.temp }}/inplace-on-code/original/voicevox_benchmark.js
            ${{ runner.temp }}/inplace-on-code/original/voicevox_benchmark.wasm
            ${{ runner.temp }}/inplace-on-code/rebuilt/voicevox_benchmark.js
            ${{ runner.temp }}/inplace-on-code/rebuilt/voicevox_benchmark.wasm
            ${{ runner.temp }}/inplace-on-code/candidate/voicevox_benchmark.js
            ${{ runner.temp }}/inplace-on-code/candidate/voicevox_benchmark.wasm
            ${{ runner.temp }}/inplace-on-code/transfer.json
            ${{ runner.temp }}/inplace-on-code/LICENSES.txt
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: success() && steps.validation.outcome == 'success'
        with:
          name: webcpu-pristine-on-jit-capture
          path: |
            ${{ runner.temp }}/inplace-on-result/capture.json
            ${{ runner.temp }}/inplace-on-result/capture-summary.json
          if-no-files-found: error
