name: WebCPU reviewed immutable ON timing consumer
on:
  workflow_dispatch:
  push:
    branches: ['benchmark/native-browser-research-20261008']
    paths:
      - 'benchmarks/webcpu-research/inplace-leaky-on/timing-consumer/**'
      - 'benchmarks/webcpu-research/inplace-leaky-on/timing-release/**'
      - '.github/workflows/benchmark-webcpu-inplace-leaky-on-consumer.yml'
permissions:
  contents: read
  actions: read
concurrency:
  group: webcpu-inplace-leaky-on-consumer-${{ github.ref }}
  cancel-in-progress: false
jobs:
  exact-code-timing:
    if: github.repository == 'Hiroshiba/voicevox_core'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    defaults:
      run:
        working-directory: benchmarks/webcpu-research/inplace-leaky-on
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          persist-credentials: false
          sparse-checkout: |
            benchmarks/webcpu-research/inplace-leaky-on
            .github/workflows
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Configure private browser path after checkout
        run: echo "PLAYWRIGHT_BROWSERS_PATH=$RUNNER_TEMP/on-consumer-playwright" >> "$GITHUB_ENV"
      - name: Require complete Linux process coverage before artifact or browser work
        run: |
          python -m pip install psutil==7.2.2
          python timing-consumer/consumer_resources.py --self-test
      - name: Verify sources, offline fixtures and reviewed release before download
        id: release
        run: |
          sha256sum --check browser/SHA256SUMS
          sha256sum --check code-transfer/SHA256SUMS
          sha256sum --check timing-release/SHA256SUMS
          sha256sum --check timing-consumer/SHA256SUMS
          python -m unittest discover -s code-transfer -p 'test_*.py'
          python -m unittest discover -s timing-release -p 'test_*.py'
          python -m unittest discover -s timing-consumer -p 'test_*.py'
          python timing-consumer/consumer_gate.py --github-output
      - name: Verify immutable producer artifact API identity and advertised digest
        env:
          GH_TOKEN: ${{ github.token }}
        run: python timing-consumer/consumer_artifact.py --output "$RUNNER_TEMP/on-artifact-metadata.json"
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          github-token: ${{ github.token }}
          repository: Hiroshiba/voicevox_core
          run-id: ${{ steps.release.outputs.run_id }}
          artifact-ids: ${{ steps.release.outputs.artifact_id }}
          path: ${{ runner.temp }}/on-immutable-code
          merge-multiple: true
      - name: Prepare separately pinned private model and browser runtime
        run: |
          python timing-consumer/prepare_private_model.py --output "$RUNNER_TEMP/on-private-model/sample.vvm"
          python -m pip install uv==0.11.23 playwright==1.63.0
          python -m playwright install --with-deps chromium
      - name: Exact transfer preflight, ordinary ON gates and 27 calls
        id: timing
        run: |
          mkdir -p "$RUNNER_TEMP/on-timing-result"
          uv run --script timing-release/timing_confirmation.py \
            --code-directory "$RUNNER_TEMP/on-immutable-code" \
            --model "$RUNNER_TEMP/on-private-model/sample.vvm" \
            --artifact-metadata "$RUNNER_TEMP/on-artifact-metadata.json" \
            --harness extracted/base/voicevox_webcpu_research.py \
            --dispatch-helper extracted/base/runtime/core_dispatch_check.js \
            --output "$RUNNER_TEMP/on-timing-result/timing.json"
      - name: Explicit structural and whole-run quality summary
        id: summary
        run: python timing-release/timing_validate.py "$RUNNER_TEMP/on-timing-result/timing.json" --output "$RUNNER_TEMP/on-timing-result/timing-summary.json"
      - name: Independently recompute quality before permitting a performance claim
        run: python timing-consumer/quality_gate.py "$RUNNER_TEMP/on-timing-result/timing.json" "$RUNNER_TEMP/on-timing-result/timing-summary.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always() && steps.summary.outcome == 'success'
        with:
          name: webcpu-pristine-on-exact-code-timing
          path: |
            ${{ runner.temp }}/on-timing-result/timing.json
            ${{ runner.temp }}/on-timing-result/timing-summary.json
          if-no-files-found: error
          retention-days: 14
