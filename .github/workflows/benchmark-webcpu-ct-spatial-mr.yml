name: WebCPU strict FP32 CT spatial MR milestone
on:
  push:
    branches: ['benchmark/native-browser-research-20261008']
    paths:
      - 'benchmarks/webcpu-research/ct-spatial-mr/voicevox_core_benchmark.py'
      - '.github/workflows/benchmark-webcpu-ct-spatial-mr.yml'
permissions:
  contents: read
concurrency:
  group: webcpu-ct-spatial-mr-${{ github.ref }}
  cancel-in-progress: false
jobs:
  browser-off:
    if: github.repository == 'Hiroshiba/voicevox_core'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          persist-credentials: false
          sparse-checkout: benchmarks/webcpu-research/ct-spatial-mr
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install pinned orchestration tools and Chromium dependencies
        run: |
          python -m pip install uv==0.11.23 playwright==1.63.0
          python -m playwright install-deps chromium
      - name: Verify complete distributed source and offline tests
        working-directory: benchmarks/webcpu-research/ct-spatial-mr
        run: |
          echo "9fcb1044f39ac30be27ee12331fd1285c2e1ab50c839fc1493dabbb4e83cde7a  voicevox_core_benchmark.py" | sha256sum --check
          uv run --script voicevox_core_benchmark.py --help
          uv run --script voicevox_core_benchmark.py --dry-run
          uv run --script voicevox_core_benchmark.py --self-test
      - name: Run exact distributed script, build gates and actual browser screen
        id: benchmark
        continue-on-error: true
        working-directory: benchmarks/webcpu-research/ct-spatial-mr
        run: |
          uv run --script voicevox_core_benchmark.py \
            --cache-dir "$RUNNER_TEMP/ct-private" \
            --output "$RUNNER_TEMP/ct-public"
      - name: Validate public summary and exact standalone HTML
        id: validation
        if: always() && steps.benchmark.outcome != 'skipped'
        working-directory: benchmarks/webcpu-research/ct-spatial-mr
        run: |
          uv run --script voicevox_core_benchmark.py --validate-report "$RUNNER_TEMP/ct-public"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always() && steps.validation.outcome == 'success'
        with:
          name: webcpu-ct-spatial-mr-summary-and-html
          path: |
            ${{ runner.temp }}/ct-public/summary.json
            ${{ runner.temp }}/ct-public/report.html
          if-no-files-found: error
          retention-days: 14
      - name: Require completed valid benchmark
        if: always()
        env:
          BENCHMARK_OUTCOME: ${{ steps.benchmark.outcome }}
          VALIDATION_OUTCOME: ${{ steps.validation.outcome }}
        run: |
          test "$BENCHMARK_OUTCOME" = success
          test "$VALIDATION_OUTCOME" = success
