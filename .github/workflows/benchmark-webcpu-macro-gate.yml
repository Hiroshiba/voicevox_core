name: Strict FP32 XNN macro traversal correctness gate
on:
  push:
    branches: ['benchmark/native-browser-research-20261008']
    paths:
      - 'benchmarks/webcpu-research/macro/**'
      - '.github/workflows/benchmark-webcpu-macro-gate.yml'
permissions:
  contents: read
concurrency:
  group: webcpu-fp32-macro-gate-${{ github.ref }}
  cancel-in-progress: false
jobs:
  correctness-only:
    if: github.repository == 'Hiroshiba/voicevox_core' && github.ref == 'refs/heads/benchmark/native-browser-research-20261008'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          persist-credentials: false
          sparse-checkout: benchmarks/webcpu-research/macro
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - name: Verify frozen source and configure isolated paths
        run: |
          set -euo pipefail
          cd benchmarks/webcpu-research/macro
          sha256sum -c SOURCE_SHA256SUMS
          python -m py_compile *.py
          echo "BENCH_CACHE=$RUNNER_TEMP/voicevox-core-benchmark" >> "$GITHUB_ENV"
          echo "PLAYWRIGHT_BROWSERS_PATH=$RUNNER_TEMP/voicevox-core-benchmark/playwright" >> "$GITHUB_ENV"
          mkdir -p results "$GITHUB_WORKSPACE/results/macro-gate"
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ${{ runner.temp }}/voicevox-core-benchmark/builds
            ${{ runner.temp }}/voicevox-core-benchmark/cargo-target
            ${{ runner.temp }}/voicevox-core-benchmark/cargo/bin
            ${{ runner.temp }}/voicevox-core-benchmark/rustup
            ${{ runner.temp }}/voicevox-core-benchmark/runtimes
            ${{ runner.temp }}/voicevox-core-benchmark/playwright
            ${{ runner.temp }}/voicevox-core-benchmark/emsdk-4.0.8
          key: Linux-voicevox-research-${{ github.sha }}
          restore-keys: Linux-voicevox-research-
      - name: Install pinned browser tooling
        run: |
          python -m pip install --disable-pip-version-check playwright==1.63.0
          python -m playwright install --with-deps chromium
      - name: Resolve verified runtime and regenerate pinned source
        working-directory: benchmarks/webcpu-research/macro
        run: python prepare_inputs.py
      - name: Reconstruct original objects and build three strict diagnostics
        working-directory: benchmarks/webcpu-research/macro
        run: |
          set -euo pipefail
          python rebuild_control.py
          python make_patch.py
          python build_diagnostic.py
      - name: Dedicated Worker real pthreadpool2 exactness matrix
        working-directory: benchmarks/webcpu-research/macro
        run: |
          set -euo pipefail
          python run_browser.py > results/browser-matrix.log 2>&1
          python validate_results.py --browser
      - name: Print complete synthetic gate evidence and collect allowlisted receipts
        id: privacy
        if: always()
        working-directory: benchmarks/webcpu-research/macro
        run: |
          set -euo pipefail
          python log_results.py | tee "$GITHUB_WORKSPACE/results/macro-gate/complete-gate.log"
          python - <<'PY'
          from pathlib import Path
          import shutil,json,os
          target=Path(os.environ['GITHUB_WORKSPACE'])/'results/macro-gate'
          for name in ['dependency-provenance.json','BROWSER_GATE.json','browser-correctness.json','browser-condition0.json','browser-condition1.json','browser-condition2.json']:
              p=Path('results')/name
              if p.exists():
                  text=p.read_text();json.loads(text)
                  assert all(x not in text.lower() for x in ['wav_base64','data:audio/','audio_outputs','tensor_data','model_bytes'])
                  shutil.copyfile(p,target/name)
          for name in ['control-rebuild.json','diagnostic-build.json']:
              p=Path('manifests')/name
              if p.exists():shutil.copyfile(p,target/name)
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always() && steps.privacy.outcome == 'success'
        with:
          name: xnn-macro-untimed-correctness
          path: results/macro-gate/
          if-no-files-found: error
      # Deliberately no cache-save, inference timing, full CORE build, or model/audio input.
